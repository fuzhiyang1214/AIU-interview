<!DOCTYPE html>
<!-- index.html —— 前端：只负责 UI 组织与订阅，不含任何推理逻辑 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO 实时检测</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 28px;
      background: #f5f6f8; color: #1a1a1a;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
    h1 small { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; color: #888; }
    .stage {
      position: relative; padding: 10px; border-radius: 14px;
      background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    .stage img { display: block; width: min(78vw, 860px); border-radius: 8px; background: #000; }
    .stats {
      display: flex; gap: 28px; padding: 12px 26px; border-radius: 12px;
      background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 20px; color: #d32f2f; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: #888; letter-spacing: .5px; }
    .hint { font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <h1>YOLO 实时目标检测
    <small>摄像头画面由后端推理推送，本页面仅做显示</small>
  </h1>

  <div class="stage">
    <!-- MJPEG 流：浏览器原生支持 multipart/x-mixed-replace，直接放进 img 即可 -->
    <img id="video" src="/video_feed" alt="实时检测画面">
  </div>

  <div class="stats">
    <div class="stat"><b id="fps">--</b><span>FPS</span></div>
    <div class="stat"><b id="boxes">--</b><span>检测目标数</span></div>
  </div>

  <p class="hint">按 Ctrl+C 停止后端服务</p>

  <script>
    // 订阅后端统计接口，每 500 ms 刷新一次数字
    async function tick() {
      try {
        const r = await fetch('/stats');
        const d = await r.json();
        document.getElementById('fps').textContent = d.fps.toFixed(1);
        document.getElementById('boxes').textContent = d.boxes;
      } catch (e) {
        document.getElementById('fps').textContent = '--';
        document.getElementById('boxes').textContent = '--';
      }
    }
    setInterval(tick, 500);
    tick();
  </script>
</body>
</html>
