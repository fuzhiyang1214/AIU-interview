<!DOCTYPE html>
<!--
  任务 1-2 · Web 前端（单文件 · 无框架 · 零构建）

  职责：只负责 UI 组织与「订阅」。
        · 把用户输入 POST 给后端 /api/chat
        · 持续读取 SSE 字节流，逐字渲染，并实时显示首字延迟 / token 数
  不做任何业务计算，也不与 Dify 直接通信。

  请求契约：POST /api/chat  {"query", "inputs", "user", "conversation_id"}
  响应格式：text/event-stream；事件体与 Dify 一致（message / message_end / error）

  启动：python server.py  →  浏览器打开 http://127.0.0.1:8000
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>本地大模型链 · Web 接入</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1d2230; --line:#272d3b;
    --text:#e8ebf2; --muted:#8b93a7; --dim:#5d6577;
    --accent:#4c8dff; --ok:#3ddc97;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  code,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}

  header{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-bottom:1px solid var(--line);
    background:var(--panel); flex:none;
  }
  header h1{font-size:14px; font-weight:600; letter-spacing:.2px}
  .badge{
    font-size:11px; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); white-space:nowrap;
  }
  .badge.ok{color:var(--ok); border-color:rgba(61,220,151,.35)}
  .spacer{flex:1}
  #reset{
    font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--line);
  }
  #reset:hover{color:var(--text); border-color:var(--dim)}

  main{
    flex:1; overflow-y:auto; padding:18px 16px 6px;
    display:flex; flex-direction:column;
  }
  .wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:14px; width:100%}
  main.has-msg #list{margin-top:auto}

  .msg{display:flex; flex-direction:column; max-width:100%}
  .msg.user{align-items:flex-end}
  .bubble{
    padding:9px 13px; border-radius:10px; white-space:pre-wrap; word-break:break-word;
    max-width:88%;
  }
  .user .bubble{background:var(--accent); color:#fff; border-bottom-right-radius:3px}
  .ai .bubble{
    background:var(--panel); border:1px solid var(--line);
    border-bottom-left-radius:3px; max-width:100%;
  }
  .meta{font-size:11px; color:var(--dim); margin-top:5px; letter-spacing:.2px}
  .user .meta{text-align:right}

  pre.code{
    background:#0b0d11; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin:8px 0; overflow-x:auto;
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:12.5px;
    line-height:1.5; white-space:pre;
  }

  .cursor{
    display:inline-block; width:7px; height:14px; vertical-align:-2px;
    background:var(--accent); margin-left:2px; animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .empty{color:var(--muted); text-align:center; padding:32px 0 8px; margin:auto 0}
  .empty p{font-size:13px; margin-bottom:14px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
  .chip{
    font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
  }
  .chip:hover{color:var(--text); border-color:var(--accent)}

  footer{
    flex:none; border-top:1px solid var(--line); background:var(--panel);
    padding:10px 16px 12px;
  }
  .composer{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end}
  textarea{
    flex:1; resize:none; min-height:40px; max-height:160px;
    background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font:inherit; outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  #send{
    flex:none; height:40px; padding:0 18px; border-radius:10px; cursor:pointer;
    background:var(--accent); color:#fff; border:none; font-size:13px; font-weight:600;
  }
  #send:disabled{opacity:.4; cursor:not-allowed}
  .hint{
    max-width:760px; margin:6px auto 0; font-size:11px; color:var(--dim);
    display:flex; justify-content:space-between; gap:12px;
  }
  .err{color:#ff7b7b}
</style>
</head>
<body>

<header>
  <h1>本地大模型链 · Web 接入</h1>
  <span class="badge">qwen2.5:7b</span>
  <span class="badge ok">本地 GPU</span>
  <span class="spacer"></span>
  <button id="reset">新对话</button>
</header>

<main id="main">
  <div class="wrap" id="list"></div>
  <div class="wrap empty" id="empty">
    <p>链路：浏览器 → server.py → Dify API → Ollama → 本机 GPU</p>
    <div class="chips">
      <span class="chip">用一句话介绍你自己</span>
      <span class="chip">写一个 Python 快速排序</span>
      <span class="chip">解释什么是 DNS 污染</span>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">
    <span>多轮对话由 conversation_id 维持</span>
    <span id="stat"></span>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const list = $("list"), empty = $("empty"), input = $("input"), sendBtn = $("send");

let conversationId = "";
let busy = false;
const userId = "web-" + Math.random().toString(36).slice(2, 8);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function addUser(text) {
  const m = el("div", "msg user");
  m.appendChild(el("div", "bubble", text));
  list.appendChild(m);
}

function addAI() {
  const m = el("div", "msg ai");
  const bubble = el("div", "bubble");
  const cursor = el("span", "cursor");
  bubble.appendChild(cursor);
  const meta = el("div", "meta");
  m.append(bubble, meta);
  list.appendChild(m);
  return { bubble, cursor, meta, raw: "" };
}

/* 极简渲染：只把 ``` 围栏块提成 <pre>，其余按纯文本显示 */
function render(ui) {
  const parts = ui.raw.split("```");
  ui.bubble.textContent = "";
  parts.forEach((seg, i) => {
    if (i % 2 === 1) {
      let body = seg, lang = "", nl = seg.indexOf("\n");
      if (nl >= 0) { lang = seg.slice(0, nl).trim(); body = seg.slice(nl + 1); }
      const box = el("pre", "code");
      if (lang) box.dataset.lang = lang;
      box.textContent = body.replace(/\n+$/, "");
      ui.bubble.appendChild(box);
    } else if (seg) {
      ui.bubble.appendChild(document.createTextNode(seg));
    }
  });
  ui.bubble.appendChild(ui.cursor);
}

function scrollDown() { $("main").scrollTop = $("main").scrollHeight; }

function handleEvent(ev, ui, t0) {
  if (ev.event === "message") {
    if (ev.conversation_id) conversationId = ev.conversation_id;
    ui.raw += (ev.answer || "");
    render(ui);
    if (ui.firstTokenAt === undefined) ui.firstTokenAt = performance.now();
    scrollDown();
  } else if (ev.event === "message_end") {
    const u = (ev.metadata && ev.metadata.usage) || {};
    const total = ((performance.now() - t0) / 1000).toFixed(2);
    const ttft = ((ui.firstTokenAt ? ui.firstTokenAt - t0 : 0) / 1000).toFixed(2);
    ui.meta.textContent = `首字 ${ttft}s · 总耗时 ${total}s · ${u.total_tokens || "?"} tokens`;
    $("stat").textContent = `out ${u.completion_tokens || "?"} tok · lat ${u.latency || "-"}s`;
  } else if (ev.event === "error") {
    ui.meta.classList.add("err");
    ui.meta.textContent = ev.message || "请求失败";
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  empty.style.display = "none";
  $("main").classList.add("has-msg");
  input.value = ""; input.style.height = "auto";

  addUser(text);
  const ui = addAI();
  const t0 = performance.now();
  scrollDown();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: text,
        inputs: {},
        user: userId,
        conversation_id: conversationId
      })
    });

    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || ("HTTP " + res.status));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        for (const line of block.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const raw = line.slice(5).trim();
          if (!raw) continue;
          try { handleEvent(JSON.parse(raw), ui, t0); } catch (e) {}
        }
      }
    }
  } catch (err) {
    ui.meta.classList.add("err");
    ui.meta.textContent = "错误：" + err.message;
  } finally {
    ui.cursor.remove();
    busy = false; sendBtn.disabled = false;
    scrollDown();
    input.focus();
  }
}

sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
document.querySelectorAll(".chip").forEach((c) => {
  c.onclick = () => { input.value = c.textContent; send(); };
});
$("reset").onclick = () => {
  conversationId = "";
  list.innerHTML = "";
  empty.style.display = "";
  $("main").classList.remove("has-msg");
  $("stat").textContent = "";
  input.focus();
};
input.focus();
</script>
</body>
</html>
